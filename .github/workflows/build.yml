name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar y empaquetar con Cordova
        run: |
          npm install -g cordova
          cordova create miApp com.telecentrotv.app TelecentroTV
          cd miApp
          rm -rf www/*
          cp ../index.html www/index.html
          cordova platform add android

      - name: Compilar APK
        run: |
          cd miApp/platforms/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v3
        with:
          name: TelecentroTV-APK
          path: miApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
